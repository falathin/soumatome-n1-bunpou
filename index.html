<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N1 Bunpou Master - Premium</title>
    <!-- Tambahkan Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="lang-show-id">
    <nav class="navbar">
        <div class="logo"><i class="bi bi-book-half"></i> N1 Bunpou</div>
        <div class="controls">
            <select id="langToggle" class="glass-select">
                <option value="id">ID</option>
                <option value="en">EN</option>
                <option value="cn">CN</option>
            </select>
            <button id="memoToggle" class="nav-btn pulse-btn"><i class="bi bi-brain"></i> Mode Hafal: OFF</button>
            <button id="themeToggle" class="nav-btn"><i class="bi bi-moon-fill"></i></button>
        </div>
    </nav>

    <div class="container">
        <aside class="sidebar slide-right">
            <h3><i class="bi bi-list-ul"></i> Daftar Modul</h3>
            
            <!-- Fitur Search -->
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="searchInput" placeholder="Cari tata bahasa...">
            </div>

            <div id="filterContainer"></div>
        </aside>
        
        <main class="content">
            <div class="header-banner fade-in">
                <h1 id="weekTitle">Memuat Data...</h1>
                <h2 id="dayTitle">Silakan tunggu</h2>
            </div>
            
            <div id="grammarCards" class="grid-layout"></div>
            
            <div id="miniExam" class="exam-section hidden fade-in">
                <h3><i class="bi bi-journal-text"></i> 練習問題 (Mini Exam)</h3>
                <div id="examContent"></div>
            </div>
        </main>
    </div>

    <!-- Modul Data Minggu 1 (Pastikan file ini tersedia di folder Anda) -->
    <script src="js/data/minggu1/h1.js"></script>
    <script src="js/data/minggu1/h2.js"></script>
    <script src="js/data/minggu1/h3.js"></script>
    <script src="js/data/minggu1/h4.js"></script>
    <script src="js/data/minggu1/h5.js"></script>
    <script src="js/data/minggu1/h6.js"></script>
    <script src="js/data/minggu1/h7.js"></script>

    <!-- Core App Engine -->
    <script src="js/app.js"></script>
</body>
</html>
